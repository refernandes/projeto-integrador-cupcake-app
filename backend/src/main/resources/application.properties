spring.application.name=backend
# Chave secreta para assinatura dos tokens JWT.
# IMPORTANTE: Em um projeto real, esta chave deve ser muito mais complexa e
# gerenciada fora do controle de versão (ex: variáveis de ambiente).
jwt.secret=7d4a6a572a722e434f4b4e404b4e2d423f4b4e404b4e2d423f4b4e404b4e2d42

# --- CONFIGURAÇÃO DO BANCO DE DADOS (MySQL) ---

# URL de conexão. 'cupcake_db' é o nome do banco de dados que será criado.
spring.datasource.url=jdbc:mysql://localhost:3306/cupcake_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Coloque aqui a senha do seu usuário 'root' do MySQL. Se não tiver, deixe em branco.
spring.datasource.password=

# --- MÁGICA DO JPA/HIBERNATE ---

# Diz ao Hibernate para analisar suas classes @Entity e criar/atualizar as tabelas no banco automaticamente.
# Isso significa que você não precisa rodar o schema.sql manualmente!
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate está executando (ótimo para debug).
spring.jpa.show-sql=true